<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyhop</title>
<style>
  :root {
    --ink: #1F4F57;
    --coral: #FF6B5A;
    --sun: #FFC93C;
    --paper: rgba(255, 255, 255, 0.88);
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #FFD9B0;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Trebuchet MS", sans-serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; }

  #hud {
    position: fixed; top: 16px; left: 16px;
    display: flex; gap: 10px; pointer-events: none;
    opacity: 0; transition: opacity .3s;
  }
  #hud.on { opacity: 1; }
  .chip {
    background: var(--paper);
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 800; font-size: 16px;
    display: flex; align-items: center; gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .gem-icon {
    width: 12px; height: 12px; background: var(--sun);
    transform: rotate(45deg); border-radius: 2px;
    box-shadow: inset -2px -2px 0 rgba(0,0,0,.12);
  }

  .overlay {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(255, 217, 176, 0.35);
    backdrop-filter: blur(3px);
  }
  .overlay.on { display: flex; }
  .card {
    background: var(--paper);
    border-radius: 28px;
    padding: 36px 44px 32px;
    max-width: 440px; width: calc(100% - 48px);
    box-shadow: 0 18px 50px rgba(31, 79, 87, 0.22);
  }
  .card h1 {
    margin: 0 0 6px; font-size: 54px; line-height: 1;
    font-weight: 900; letter-spacing: -0.03em; color: var(--coral);
  }
  .card p { margin: 0 0 22px; font-size: 17px; line-height: 1.45; }
  .back {
    display: inline-block; margin-bottom: 14px;
    font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink); opacity: .7; text-decoration: none;
  }
  .back:hover { opacity: 1; color: var(--coral); }
  .controls {
    display: grid; grid-template-columns: auto 1fr; gap: 10px 18px;
    margin: 0 0 26px; font-size: 15px; align-items: center;
  }
  .controls dt { font-weight: 800; }
  .controls dd { margin: 0; }
  kbd {
    display: inline-block; min-width: 18px; text-align: center;
    background: #fff; border: 2px solid var(--ink); border-bottom-width: 4px;
    border-radius: 7px; padding: 1px 6px; font: 800 13px ui-rounded, "Trebuchet MS", sans-serif;
    margin-right: 3px;
  }
  button.go {
    background: var(--coral); color: #fff; border: 0;
    border-radius: 16px; padding: 14px 30px;
    font: 800 18px ui-rounded, "Trebuchet MS", sans-serif;
    cursor: pointer; box-shadow: 0 5px 0 #C9473A;
    transition: transform .08s, box-shadow .08s;
  }
  button.go:hover { transform: translateY(1px); box-shadow: 0 4px 0 #C9473A; }
  button.go:active { transform: translateY(5px); box-shadow: 0 0 0 #C9473A; }
  button.go:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .stats { font-size: 20px; font-weight: 800; line-height: 1.7; margin-bottom: 22px; }

  #toast {
    position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px;
    font-weight: 800; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    #hud, #toast, button.go { transition: none; }
  }
</style>
</head>
<body>

<div id="hud">
  <div class="chip"><span class="gem-icon"></span><span id="gems">0 / 0</span></div>
  <div class="chip"><span id="time">0:00.0</span></div>
  <div class="chip">Falls <span id="falls">0</span></div>
</div>

<div id="toast"></div>

<div id="title" class="overlay on">
  <div class="card">
    <a class="back" href="../">&larr; playground</a>
    <h1>Skyhop</h1>
    <p>Follow the floating path to the flag. Grab every gem on the way.</p>
    <dl class="controls">
      <dt>Move</dt><dd><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrow keys</dd>
      <dt>Jump</dt><dd><kbd>Space</kbd> Press again in the air to double jump</dd>
      <dt>Camera</dt><dd><kbd>Q</kbd><kbd>E</kbd> or drag the mouse</dd>
      <dt>Other</dt><dd><kbd>R</kbd> back to checkpoint, <kbd>M</kbd> mute</dd>
    </dl>
    <button class="go" id="go">Play</button>
  </div>
</div>

<div id="win" class="overlay">
  <div class="card">
    <h1>You made it</h1>
    <div class="stats" id="winStats"></div>
    <button class="go" id="again">Play again</button>
  </div>
</div>

<script type="module">
import * as THREE from './three.module.min.js';

THREE.ColorManagement.enabled = false;

// ---------- Renderer, scene, camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xFFD9B0, 45, 190);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 700);

// Gradient sky dome that follows the camera
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(400, 16, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color('#79A6E8') },
      bottom: { value: new THREE.Color('#FFD9B0') }
    },
    vertexShader: 'varying float h; void main(){ h = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 bottom; varying float h; void main(){ float t = smoothstep(-0.05, 0.55, h); gl_FragColor = vec4(mix(bottom, top, t), 1.0); }'
  })
);
scene.add(sky);

scene.add(new THREE.HemisphereLight(0xffffff, 0xB9A9DC, 0.95 * Math.PI));
const sun = new THREE.DirectionalLight(0xFFF1DC, 0.75 * Math.PI);
sun.position.set(12, 22, 9);
scene.add(sun);

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ---------- Materials ----------
const mat = (c) => new THREE.MeshLambertMaterial({ color: c });
const sideMat = mat('#2B6F77');
const topMat = mat('#8EDBB8');
const moverSide = mat('#B04A3C');
const moverTop = mat('#FF9A7E');
const gemMat = new THREE.MeshPhongMaterial({ color: '#FFC93C', emissive: '#7a5a00', shininess: 80, flatShading: true });

// ---------- Level ----------
const platforms = [];

function updateBounds(p) {
  const c = p.mesh.position;
  p.min.set(c.x - p.hw, c.y - p.hh, c.z - p.hd);
  p.max.set(c.x + p.hw, c.y + p.hh, c.z + p.hd);
}

// x, z are the center; top is the height of the walkable surface
function addPlat(x, top, z, w, d, move) {
  const t = 1.2;
  const geo = new THREE.BoxGeometry(w, t, d);
  const s = move ? moverSide : sideMat;
  const tp = move ? moverTop : topMat;
  // BoxGeometry face order: +x, -x, +y, -y, +z, -z
  const mesh = new THREE.Mesh(geo, [s, s, tp, s, s, s]);
  const p = {
    mesh, hw: w / 2, hh: t / 2, hd: d / 2,
    base: new THREE.Vector3(x, top - t / 2, z),
    delta: new THREE.Vector3(),
    min: new THREE.Vector3(), max: new THREE.Vector3(),
    move: move || null
  };
  mesh.position.copy(p.base);
  scene.add(mesh);
  updateBounds(p);
  platforms.push(p);
  return p;
}

// Start area
addPlat(0, 0, 0, 10, 10);
// Opening hops
addPlat(0, 0, -10, 4, 4);
addPlat(3, 1, -15.5, 3.5, 3.5);
addPlat(-1, 2, -21, 3.5, 3.5);
addPlat(-5, 2.5, -26, 3.5, 3.5);
// Checkpoint 1
addPlat(-5, 3, -33, 7, 7);
// Sliding platform
// Travel is -39.5 to -45, so the gap to either side never exceeds about 1.25
addPlat(-5, 3, -42.25, 3.5, 3.5, { axis: 'z', amp: 2.75, speed: 0.9, phase: 0 });
// Bonus ledge off to the side, reachable from the sliding platform
addPlat(-11, 4, -44, 2.6, 2.6);
addPlat(-5, 3, -51, 6, 6);
// Staircase
addPlat(-5, 4.5, -57.5, 3.5, 3.5);
addPlat(-2, 6, -62, 3.5, 3.5);
addPlat(1, 7.5, -66.5, 3.5, 3.5);
addPlat(4, 9, -71, 3.5, 3.5);
// Narrow beam
addPlat(4, 9, -81, 1.6, 13);
// Checkpoint 2
addPlat(4, 9, -94, 8, 8);
// Elevator
addPlat(4, 11.5, -101, 4, 4, { axis: 'y', amp: 2.5, speed: 0.9, phase: 0 });
addPlat(4, 14, -108, 5, 5);
// Stepping stones
addPlat(7, 15, -113.5, 2.6, 2.6);
addPlat(10, 16, -117.5, 2.6, 2.6);
addPlat(7, 17, -122, 2.6, 2.6, { axis: 'x', amp: 1.8, speed: 1.2, phase: 0 });
addPlat(3, 18, -126, 2.6, 2.6);
// Goal
addPlat(0, 18, -134, 10, 10);

// ---------- Gems ----------
const gems = [];
function addGem(x, y, z) {
  const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.38), gemMat);
  mesh.position.set(x, y, z);
  scene.add(mesh);
  gems.push({ mesh, baseY: y, got: false, pop: 0, seed: Math.random() * 6.28 });
}
[
  [0, 1.2, -10], [3, 2.2, -15.5], [-1, 3.2, -21], [-5, 3.7, -26],
  [-3, 4.2, -33], [-5, 4.6, -42.25], [-5, 4.2, -51],
  [-5, 5.7, -57.5], [-2, 7.2, -62], [1, 8.7, -66.5], [4, 10.2, -71],
  [4, 10.2, -77], [4, 10.2, -81], [4, 10.2, -85], [2, 10.2, -94],
  [4, 12.8, -101], [4, 15.2, -108], [7, 16.2, -113.5], [10, 17.2, -117.5],
  [7, 18.2, -122], [3, 19.2, -126], [-3.5, 19.2, -134], [3.5, 19.2, -134],
  [-11, 5.2, -44]
].forEach(g => addGem(g[0], g[1], g[2]));

// ---------- Checkpoints ----------
const checkpoints = [];
const START = new THREE.Vector3(0, 0, 2);
function addCheckpoint(x, top, z) {
  const group = new THREE.Group();
  group.position.set(x, top, z);
  const disc = new THREE.Mesh(
    new THREE.CylinderGeometry(1.3, 1.3, 0.08, 24),
    new THREE.MeshLambertMaterial({ color: '#9bb7b4' })
  );
  disc.position.y = 0.04;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 8), mat('#EFEFEF'));
  pole.position.set(-1.0, 1.1, 0);
  const flagMat = new THREE.MeshLambertMaterial({ color: '#9bb7b4', side: THREE.DoubleSide });
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.55), flagMat);
  flag.position.set(-0.55, 1.9, 0);
  group.add(disc, pole, flag);
  scene.add(group);
  checkpoints.push({ pos: new THREE.Vector3(x, top, z), disc, flag, flagMat, active: false });
}
addCheckpoint(-5, 3, -33);
addCheckpoint(4, 9, -94);

// ---------- Goal ----------
const goal = new THREE.Group();
goal.position.set(0, 18, -134);
const gPole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 7, 10), mat('#F4F4F4'));
gPole.position.y = 3.5;
const gFlag = new THREE.Mesh(
  new THREE.PlaneGeometry(2.6, 1.6),
  new THREE.MeshLambertMaterial({ color: '#FF6B5A', side: THREE.DoubleSide })
);
gFlag.position.set(1.4, 6.1, 0);
const gBall = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), gemMat);
gBall.position.y = 7.2;
goal.add(gPole, gFlag, gBall);
scene.add(goal);

// ---------- Scenery: floating rocks and clouds ----------
const rockMat = new THREE.MeshPhongMaterial({ color: '#C9B8E8', flatShading: true, shininess: 0 });
for (let i = 0; i < 46; i++) {
  const r = 1 + Math.random() * 4;
  const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), rockMat);
  const side = Math.random() < 0.5 ? -1 : 1;
  rock.position.set(side * (22 + Math.random() * 55), -25 + Math.random() * 55, 30 - Math.random() * 190);
  rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  rock.scale.y = 0.6 + Math.random() * 0.6;
  scene.add(rock);
}
const clouds = [];
const cloudMat = new THREE.MeshLambertMaterial({ color: '#ffffff', transparent: true, opacity: 0.92 });
for (let i = 0; i < 16; i++) {
  const c = new THREE.Group();
  const n = 3 + Math.floor(Math.random() * 3);
  for (let k = 0; k < n; k++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(2 + Math.random() * 2.5, 10, 8), cloudMat);
    s.position.set(k * 3 - n * 1.5, Math.random() * 1.2, Math.random() * 2);
    s.scale.y = 0.65;
    c.add(s);
  }
  c.position.set(-90 + Math.random() * 180, 22 + Math.random() * 30, 20 - Math.random() * 190);
  scene.add(c);
  clouds.push(c);
}

// ---------- Player ----------
const player = {
  pos: new THREE.Vector3(), vel: new THREE.Vector3(),
  hw: 0.4, h: 1.0,
  onGround: false, ground: null, wasGround: false,
  coyote: 0, buffer: 0, jumpsLeft: 1, jumping: false,
  facing: 0, squash: 1
};

const playerGroup = new THREE.Group();
playerGroup.rotation.order = 'YXZ';
const bodyMat = mat('#FF6B5A');
const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.86, 0.8), bodyMat);
body.position.y = 0.52;
const belly = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.38, 0.04), mat('#FFE3C2'));
belly.position.set(0, 0.36, 0.41);
const eyeMat = mat('#1b2a30');
const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.2, 0.05), eyeMat);
const eyeR = eyeL.clone();
eyeL.position.set(-0.17, 0.72, 0.41);
eyeR.position.set(0.17, 0.72, 0.41);
const footL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.12, 0.4), mat('#C9473A'));
const footR = footL.clone();
footL.position.set(-0.2, 0.06, 0.05);
footR.position.set(0.2, 0.06, 0.05);
playerGroup.add(body, belly, eyeL, eyeR, footL, footR);
scene.add(playerGroup);

// Blob shadow so you can judge where you will land
const blob = new THREE.Mesh(
  new THREE.CircleGeometry(0.5, 20),
  new THREE.MeshBasicMaterial({ color: 0x0b2a30, transparent: true, opacity: 0.28, depthWrite: false })
);
blob.rotation.x = -Math.PI / 2;
scene.add(blob);

// ---------- Game state ----------
let state = 'title'; // title | play | won
let clock = 0;       // continuous time, drives moving platforms
let runTime = 0;
let falls = 0;
let collected = 0;
let respawn = START.clone();
let muted = false;

const cam = { yaw: 0, pitch: 0.5, dist: 10, target: new THREE.Vector3() };

const el = {
  hud: document.getElementById('hud'),
  gems: document.getElementById('gems'),
  time: document.getElementById('time'),
  falls: document.getElementById('falls'),
  title: document.getElementById('title'),
  win: document.getElementById('win'),
  winStats: document.getElementById('winStats'),
  toast: document.getElementById('toast')
};

let toastTimer = 0;
function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('on'), 1600);
}

function fmtTime(t) {
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
}

// ---------- Audio ----------
let actx = null;
function beep(freq, dur, type, vol, slide) {
  if (!actx || muted) return;
  const t0 = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
  g.gain.setValueAtTime(vol || 0.05, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur);
}
const sfx = {
  jump: () => beep(300, 0.14, 'square', 0.045, 260),
  air: () => beep(420, 0.14, 'square', 0.045, 300),
  land: () => beep(110, 0.08, 'triangle', 0.08, -40),
  gem: () => { beep(880, 0.08, 'triangle', 0.07); setTimeout(() => beep(1320, 0.12, 'triangle', 0.07), 70); },
  check: () => { beep(520, 0.1, 'triangle', 0.07); setTimeout(() => beep(780, 0.18, 'triangle', 0.07), 90); },
  fall: () => beep(400, 0.35, 'sawtooth', 0.04, -320),
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'triangle', 0.08), i * 120))
};

// ---------- Input ----------
const keys = {};
const JUMP_KEYS = ['Space', 'KeyK'];
window.addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;

  if (state === 'title' && (e.code === 'Space' || e.code === 'Enter')) { startGame(); return; }
  if (state === 'won' && (e.code === 'KeyR' || e.code === 'Enter')) { startGame(); return; }

  if (state === 'play') {
    if (JUMP_KEYS.indexOf(e.code) >= 0) player.buffer = 0.14;
    if (e.code === 'KeyR') { respawnPlayer(false); }
  }
  if (e.code === 'KeyM') { muted = !muted; toast(muted ? 'Sound off' : 'Sound on'); }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.buttons & 1) {
    cam.yaw -= e.movementX * 0.005;
    cam.pitch = Math.max(0.15, Math.min(1.2, cam.pitch + e.movementY * 0.004));
  }
});

function ensureAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}

document.getElementById('go').addEventListener('click', startGame);
document.getElementById('again').addEventListener('click', startGame);

// ---------- Flow ----------
function respawnPlayer(countFall) {
  player.pos.copy(respawn);
  player.vel.set(0, 0, 0);
  player.ground = null;
  player.onGround = false;
  player.jumpsLeft = 1;
  player.jumping = false;
  player.buffer = 0;
  if (countFall) { falls++; sfx.fall(); }
  cam.target.set(player.pos.x, player.pos.y + 1.2, player.pos.z);
}

function startGame() {
  ensureAudio();
  state = 'play';
  el.title.classList.remove('on');
  el.win.classList.remove('on');
  el.hud.classList.add('on');
  gems.forEach(g => { g.got = false; g.pop = 0; g.mesh.visible = true; g.mesh.scale.set(1, 1, 1); });
  checkpoints.forEach(c => setCheckpointActive(c, false));
  collected = 0; falls = 0; runTime = 0;
  respawn = START.clone();
  cam.yaw = 0;
  respawnPlayer(false);
  keys.Space = false;
}

function setCheckpointActive(c, on) {
  c.active = on;
  const col = on ? 0xFFC93C : 0x9bb7b4;
  c.disc.material.color.setHex(col);
  c.flagMat.color.setHex(on ? 0xFF6B5A : 0x9bb7b4);
}

function win() {
  state = 'won';
  sfx.win();
  el.winStats.innerHTML =
    'Gems ' + collected + ' / ' + gems.length + '<br>' +
    'Time ' + fmtTime(runTime) + '<br>' +
    'Falls ' + falls;
  el.win.classList.add('on');
}

// ---------- Physics ----------
const GRAVITY_UP = 30, GRAVITY_DOWN = 42, MAX_FALL = 32;
const RUN_SPEED = 7.5, GROUND_ACCEL = 70, AIR_ACCEL = 38;
const JUMP_V = 11.5, AIR_JUMP_V = 10;
const COYOTE_TIME = 0.12;

function approach(v, target, maxDelta) {
  if (v < target) return Math.min(v + maxDelta, target);
  return Math.max(v - maxDelta, target);
}

function lerpAngle(a, b, t) {
  const d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
  return a + d * t;
}

function overlaps(p, pos, eps) {
  return pos.x + player.hw > p.min.x && pos.x - player.hw < p.max.x &&
         pos.z + player.hw > p.min.z && pos.z - player.hw < p.max.z &&
         pos.y + player.h > p.min.y + eps && pos.y < p.max.y - eps;
}

function updatePlatforms() {
  for (const p of platforms) {
    if (!p.move) continue;
    const prev = p.mesh.position.clone();
    p.mesh.position.copy(p.base);
    p.mesh.position[p.move.axis] += Math.sin(clock * p.move.speed + p.move.phase) * p.move.amp;
    p.delta.copy(p.mesh.position).sub(prev);
    updateBounds(p);
  }
}

function stepPlayer(dt) {
  const P = player;

  // Ride moving platforms
  if (P.onGround && P.ground && P.ground.move) P.pos.add(P.ground.delta);

  // Camera relative input
  if (keys.KeyQ) cam.yaw += 1.8 * dt;
  if (keys.KeyE) cam.yaw -= 1.8 * dt;

  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz += 1;
  if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  const len = Math.hypot(ix, iz);
  if (len > 0) { ix /= len; iz /= len; }
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
  const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  const dirx = fx * iz + rx * ix;
  const dirz = fz * iz + rz * ix;

  const accel = (P.onGround ? GROUND_ACCEL : AIR_ACCEL) * dt;
  P.vel.x = approach(P.vel.x, dirx * RUN_SPEED, accel);
  P.vel.z = approach(P.vel.z, dirz * RUN_SPEED, accel);

  if (len > 0) P.facing = lerpAngle(P.facing, Math.atan2(dirx, dirz), 1 - Math.exp(-dt * 16));

  // Timers
  P.buffer = Math.max(0, P.buffer - dt);
  P.coyote = Math.max(0, P.coyote - dt);

  // Jumping: ground jump (with coyote time) first, then one air jump
  if (P.buffer > 0) {
    if (P.coyote > 0) {
      P.vel.y = JUMP_V; P.coyote = 0; P.buffer = 0; P.jumping = true; P.onGround = false;
      P.squash = 1.3; sfx.jump();
    } else if (P.jumpsLeft > 0) {
      P.vel.y = AIR_JUMP_V; P.jumpsLeft--; P.buffer = 0; P.jumping = true;
      P.squash = 1.3; sfx.air();
    }
  }
  // Variable jump height: letting go early cuts the rise
  const held = keys.Space || keys.KeyK;
  if (!held && P.jumping && P.vel.y > 0) { P.vel.y *= 0.5; P.jumping = false; }
  if (P.vel.y <= 0) P.jumping = false;

  // Gravity
  P.vel.y -= (P.vel.y > 0 ? GRAVITY_UP : GRAVITY_DOWN) * dt;
  if (P.vel.y < -MAX_FALL) P.vel.y = -MAX_FALL;

  // Move and collide, one axis at a time
  P.pos.x += P.vel.x * dt;
  for (const p of platforms) {
    if (overlaps(p, P.pos, 0.01)) {
      const cx = (p.min.x + p.max.x) / 2;
      P.pos.x = P.pos.x < cx ? p.min.x - P.hw - 1e-4 : p.max.x + P.hw + 1e-4;
      P.vel.x = 0;
    }
  }

  P.pos.z += P.vel.z * dt;
  for (const p of platforms) {
    if (overlaps(p, P.pos, 0.01)) {
      const cz = (p.min.z + p.max.z) / 2;
      P.pos.z = P.pos.z < cz ? p.min.z - P.hw - 1e-4 : p.max.z + P.hw + 1e-4;
      P.vel.z = 0;
    }
  }

  const prevY = P.pos.y;
  const prevVelY = P.vel.y;
  P.pos.y += P.vel.y * dt;
  let landed = null;
  for (const p of platforms) {
    if (overlaps(p, P.pos, 0)) {
      if (P.vel.y <= 0 && prevY >= p.max.y - 0.3) {
        P.pos.y = p.max.y;
        P.vel.y = 0;
        landed = p;
      } else if (P.vel.y > 0) {
        P.pos.y = p.min.y - P.h - 1e-4;
        P.vel.y = 0;
        P.jumping = false;
      }
    }
  }

  P.wasGround = P.onGround;
  P.onGround = !!landed;
  P.ground = landed;
  if (P.onGround) {
    P.coyote = COYOTE_TIME;
    P.jumpsLeft = 1;
    if (!P.wasGround && prevVelY < -6) { P.squash = 0.72; sfx.land(); }
  }
}

function checkWorld(dt) {
  const P = player;

  // Fell off the world
  if (P.pos.y < -12) { respawnPlayer(true); toast('Back to the checkpoint'); return; }

  // Gems
  const cx = P.pos.x, cy = P.pos.y + 0.5, cz = P.pos.z;
  for (const g of gems) {
    if (g.got) continue;
    const dx = g.mesh.position.x - cx, dy = g.mesh.position.y - cy, dz = g.mesh.position.z - cz;
    if (dx * dx + dy * dy + dz * dz < 1.1) {
      g.got = true; g.pop = 0.25; collected++; sfx.gem();
    }
  }

  // Checkpoints
  for (const c of checkpoints) {
    if (c.active) continue;
    const dx = c.pos.x - P.pos.x, dz = c.pos.z - P.pos.z;
    if (dx * dx + dz * dz < 3 && Math.abs(c.pos.y - P.pos.y) < 2) {
      checkpoints.forEach(o => { if (o !== c) setCheckpointActive(o, false); });
      setCheckpointActive(c, true);
      respawn = c.pos.clone();
      sfx.check();
      toast('Checkpoint');
    }
  }

  // Goal
  const gx = goal.position.x - P.pos.x, gz = goal.position.z - P.pos.z;
  // Win only when you reach the pole itself, so gems on the platform can be collected first
  if (gx * gx + gz * gz < 2.6 && Math.abs(goal.position.y - P.pos.y) < 2.5 && P.onGround) win();
}

// ---------- Visuals ----------
function updateVisuals(dt) {
  const P = player;

  // Squash and stretch
  P.squash += (1 - P.squash) * Math.min(1, dt * 10);
  const sx = 1 / Math.sqrt(P.squash);
  playerGroup.scale.set(sx, P.squash, sx);
  playerGroup.position.copy(P.pos);
  const speed = Math.hypot(P.vel.x, P.vel.z);
  playerGroup.rotation.y = P.facing;
  playerGroup.rotation.x = Math.min(0.2, speed * 0.025);

  // Blob shadow on the highest surface beneath the player
  let best = -Infinity;
  for (const p of platforms) {
    if (P.pos.x + P.hw > p.min.x && P.pos.x - P.hw < p.max.x &&
        P.pos.z + P.hw > p.min.z && P.pos.z - P.hw < p.max.z &&
        p.max.y <= P.pos.y + 0.3 && p.max.y > best) best = p.max.y;
  }
  if (best > -Infinity) {
    const gap = P.pos.y - best;
    const s = Math.max(0.35, 1 - gap / 12);
    blob.visible = true;
    blob.position.set(P.pos.x, best + 0.03, P.pos.z);
    blob.scale.set(s, s, s);
  } else {
    blob.visible = false;
  }

  // Camera follow
  cam.target.x += (P.pos.x - cam.target.x) * (1 - Math.exp(-dt * 10));
  cam.target.z += (P.pos.z - cam.target.z) * (1 - Math.exp(-dt * 10));
  cam.target.y += (P.pos.y + 1.2 - cam.target.y) * (1 - Math.exp(-dt * 4));
  placeCamera();
}

function placeCamera() {
  const cp = Math.cos(cam.pitch);
  camera.position.set(
    cam.target.x + Math.sin(cam.yaw) * cp * cam.dist,
    cam.target.y + Math.sin(cam.pitch) * cam.dist,
    cam.target.z + Math.cos(cam.yaw) * cp * cam.dist
  );
  camera.lookAt(cam.target);
  sky.position.copy(camera.position);
}

function animateWorld(dt) {
  for (const g of gems) {
    if (g.got) {
      if (g.pop > 0) {
        g.pop -= dt;
        const k = 1 + (0.25 - g.pop) * 8;
        g.mesh.scale.set(k, k, k);
        g.mesh.position.y += dt * 4;
        if (g.pop <= 0) g.mesh.visible = false;
      }
      continue;
    }
    g.mesh.rotation.y += dt * 2.2;
    g.mesh.position.y = g.baseY + Math.sin(clock * 2.4 + g.seed) * 0.12;
  }
  for (const c of clouds) {
    c.position.x += dt * 0.8;
    if (c.position.x > 100) c.position.x = -100;
  }
  gFlag.rotation.y = Math.sin(clock * 3) * 0.25;
  gBall.rotation.y += dt * 2;
  for (const c of checkpoints) c.flag.rotation.y = Math.sin(clock * 3 + c.pos.x) * 0.2;
}

// ---------- Main loop ----------
let last = performance.now();
respawnPlayer(false);
cam.target.set(0, 1.2, 0);

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  clock += dt;

  updatePlatforms();
  animateWorld(dt);

  if (state === 'play') {
    runTime += dt;
    stepPlayer(dt);
    if (state === 'play') checkWorld(dt);
    updateVisuals(dt);
    el.gems.textContent = collected + ' / ' + gems.length;
    el.time.textContent = fmtTime(runTime);
    el.falls.textContent = falls;
  } else {
    // Title and win screens: slow orbit around the player
    cam.yaw += dt * 0.15;
    updateVisuals(dt);
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
</body>
